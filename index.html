    <script>
      // Resolve the initial theme before rendering to avoid a flash on reload.
      (() => {
        const theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#ffffff' : '#0c0c0c';
      })();
    </script>
